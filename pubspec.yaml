name: sefrou_smart_city
description: A smart city application for Sefrou, Morocco.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.5

  # Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0

  # Utilities
  intl: ^0.19.0
  geolocator: ^9.0.0
  url_launcher: ^6.3.2

  # Local Storage
  shared_preferences: ^2.2.0
  image_picker: ^1.2.2
  maplibre_gl: ^0.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/
    - assets/animations/

